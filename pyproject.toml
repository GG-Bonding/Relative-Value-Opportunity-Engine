[project]
name = "relative-value-engine"
version = "0.1.0"
description = "EURGBP relative-value opportunity engine: detect temporary mispricing before the market fully corrects it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "polars>=1.12",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
rv = "api.cli:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/evaluation/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = [
    "domain",
    "data",
    "mechanisms",
    "expectations",
    "features",
    "models",
    "regimes",
    "mispricing",
    "alpha",
    "opportunities",
    "execution",
    "portfolio",
    "backtest",
    "evaluation",
    "api",
    "forward",
]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
warn_return_any = false
no_implicit_optional = true

[tool.uv]
package = true
